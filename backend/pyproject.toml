[project]
name = "retriq-backend"
version = "0.1.0"
description = "FastAPI backend for Retriq."
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi[standard]",
    "uvicorn[standard]",
    "gunicorn",
    "pydantic-settings",
    "pdfplumber",
    "requests",
    "sentence-transformers",
    "faiss-cpu",
    "numpy",
    "python-docx",
    "python-dotenv",
    "python-multipart",
    "openrouter"
]

[project.scripts]
start = "main:run"

[tool.uv]
package = false
# This section is for uvicorn configuration, but since we are using gunicorn to run the app, we don't need to specify any uvicorn settings here.